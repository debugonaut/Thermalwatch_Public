# Hourly ping of the live site.
#
# One small request an hour — never the app — that proves the site answers and
# that the served cycle is still fresh. The staleness check is the real point:
# if the live cycle stops publishing (a failed run, an expired secret, a
# quota), this job turns red on the repository instead of the site quietly
# serving a stale archive for a month.
#
# This replaces the local launchd ping (deploy/launchd/com.thermalwatch.uptime-
# ping.plist), which only runs while the laptop is awake.

name: Uptime ping

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The alert below files and closes an issue, so the staleness is visible
  # wherever the repository's notifications land instead of only in Actions.
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the health endpoint
        env:
          SITE: https://sih26ekaant.web.app
          # The cycle runs every 30 minutes, so two hours is four missed slots —
          # that is a broken pipeline, not scheduler jitter or a slow run.
          MAX_AGE_HOURS: '2'
        run: |
          set -euo pipefail
          export BODY_PATH="$RUNNER_TEMP/health.json"
          curl -fsS --max-time 30 -D "$RUNNER_TEMP/headers" -o "$BODY_PATH" \
            "$SITE/api/health?probe=$(date +%s)"
          grep -iE '^(HTTP|content-type)' "$RUNNER_TEMP/headers" || true
          cat "$BODY_PATH"
          {
            echo "### Uptime ping"
            echo '```json'
            cat "$BODY_PATH"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import datetime, json, os, sys

          with open(os.environ["BODY_PATH"]) as fh:
              doc = json.load(fh)

          generated = datetime.datetime.fromisoformat(doc["cycle_generated_at_utc"])
          age_h = (datetime.datetime.now(datetime.timezone.utc) - generated).total_seconds() / 3600
          limit = float(os.environ["MAX_AGE_HOURS"])
          archive = doc.get("archive", {})
          print(f"cycle generated {generated.isoformat()} -> age {age_h:.1f} h (limit {limit:.0f} h)")
          print(f"archive through {archive.get('last_date')} | {archive.get('detections')} detections")
          if age_h > limit:
              print(f"::error::served cycle is {age_h:.1f} h old - the live cycle has stopped publishing")
              sys.exit(1)
          print("OK")
          PY

      # A red X only helps someone who is watching Actions. One issue, kept open
      # for as long as the site is stale, carries the signal into whatever
      # notifications the repository already has.
      - name: File or refresh the staleness issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SEARCH='Live cycle has not published recently in:title'
          RUN_URL="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$REPO" --state open --search "$SEARCH" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still stale at $(date -u +%FT%TZ)Z. Probe run: $RUN_URL"
            echo "commented on issue #$existing"
          else
            gh issue create --repo "$REPO" --title "Live cycle has not published recently" \
              --body "$(printf 'The cycle serving sih26ekaant.web.app is older than the alert limit, so the site is showing stale data.\n\nProbe run: %s\n\nIf the dispatch chain is intact a cycle publishes within about 25 minutes, and this issue closes itself on the next fresh probe.' "$RUN_URL")"
            echo "filed a staleness issue"
          fi

      - name: Close the issue once the site is fresh again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open \
            --search 'Live cycle has not published recently in:title' \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "The served cycle is fresh again at $(date -u +%FT%TZ)Z."
            echo "closed issue #$existing"
          else
            echo 'no open staleness issue'
          fi
