# The live cycle, off the laptop.
#
# `scripts/refresh_live_cycle.sh` does the whole job — ingest FIRMS, score with
# the frozen model, bake the 2026 archive and its day files, bake the board and
# the read-only API snapshots, build, deploy — but it was wired to launchd, and
# a background job on macOS cannot read ~/Documents without Full Disk Access.
# This runs the same script on a GitHub runner so the site keeps updating while
# the machine is closed.
#
# Cadence: about every 23 minutes — an 8-minute cycle plus a 15-minute wait in
# the chain below — because that is the site's requirement (INSAT detects at 15
# minutes). A public repository gets unlimited Actions minutes; on a private one
# this cadence is ~$90/month, so the first step refuses to run there unless the
# repository variable ALLOW_PRIVATE_PAID is set. See docs/CI_SETUP.md for the
# arithmetic and for the private-repo fallback (one cron line).
#
# Two guards, both required:
#   * `hydrate_web_assets.sh` fills the checkout with the tiles and day slices
#     that are too big for git, and refuses to continue when one is missing —
#     Firebase Hosting deletes whatever a release does not contain, so an
#     incomplete checkout would delete the live map.
#   * old releases are pruned before deploying (the script does this when
#     gcloud is authenticated), because a Spark plan's Hosting storage would
#     otherwise fill up with one retained copy per deploy.
#
# Never add a `push` trigger here. See deploy/replay-archive/README.md §1.7 for
# what that did to the live site the first time.

name: Live cycle

on:
  schedule:
    - cron: '*/30 * * * *'
  # No inputs: a dispatch's inputs did not reach the successor on 2026-10-26
  # (`github.event.inputs` arrived empty), so the chain measures its own spacing
  # from the run history instead of trusting a payload.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Refuse to spend paid minutes on a private repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ALLOW_PRIVATE_PAID: ${{ vars.ALLOW_PRIVATE_PAID }}
        run: |
          set -euo pipefail
          PRIVATE=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO" \
            | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("private")).lower())')
          if [ "$PRIVATE" = "true" ] && [ "$ALLOW_PRIVATE_PAID" != "true" ]; then
            echo "::error::$REPO is private and this workflow runs every 30 minutes (~16,700 Actions minutes/month ≈ \$118). Either make the repository public, move this workflow to a small public wrapper repository that checks out the core repo with a token (docs/CI_SETUP.md), or set the repository variable ALLOW_PRIVATE_PAID=true to accept the bill."
            exit 1
          fi
          echo "repository private=$PRIVATE — cadence affordable"

      # GitHub's cron scheduler drops scheduled fires platform-wide (a fire can
      # create no run at all while a dispatch still lands in seconds), so the
      # loop renews itself instead of relying on cron. The successor is created
      # in the first seconds of this run, not after the cycle: a runner killed
      # mid-run - the failure that stopped the chain for four hours on
      # 2026-10-26 - can no longer break the loop, because the next run already
      # exists by then. The concurrency group above keeps the successor queued
      # until this run ends.
      #
      # Exactly one successor is dispatched per run, so the population stays at
      # one pending run. A run that did not come from the chain (cron, or a
      # manual seed) only dispatches when no other run is alive, which revives a
      # dead loop without ever growing a second lineage.
      - name: Chain the successor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SCHEDULE_TOKEN is not set - the chain cannot renew itself, so only cron will refresh the site"
            exit 0
          fi
          ALIVE=$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=40" \
            | python3 -c 'import json,os,sys; me=os.environ["SELF"]; runs=json.load(sys.stdin)["workflow_runs"]; print(sum(1 for r in runs if str(r["id"]) != me and r["name"] == "Live cycle" and r["status"] in ("queued", "waiting", "pending", "in_progress")))' \
            || echo 0)
          # Two, not one: when a chained run starts, the parent can still be
          # listed as in_progress for a few seconds, and treating that as a
          # duplicate stopped the chain for good on 2026-10-26 17:01.
          if [ "$ALIVE" -ge 2 ]; then
            echo "${ALIVE} live-cycle runs are already queued or running - not starting a second chain"
            exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/live-cycle.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "queued the next cycle at $(date -u +%FT%TZ) -> HTTP $CODE"
          [ "$CODE" = 204 ]

      # The quiet time lives at the head of the successor, so the link that keeps
      # the loop alive is created before any idle minute is spent.
      # Spacing comes from the run history, not from a dispatch payload: the
      # chain starts its successor immediately (so a killed runner cannot break
      # the loop) and each run then waits out the remainder of the target gap.
      - name: Chain spacing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
          TARGET_SECONDS: '1320'          # 22 min between run starts
        run: |
          set -uo pipefail
          [ -n "${GH_TOKEN:-}" ] || exit 0
          ELAPSED=$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=30" \
            | python3 -c 'import json,os,sys,datetime as d; me=os.environ["SELF"]; now=d.datetime.now(d.timezone.utc); runs=[r for r in json.load(sys.stdin)["workflow_runs"] if r["name"]=="Live cycle"]; mine=[r for r in runs if str(r["id"])==me]; starts=[d.datetime.fromisoformat(r["run_started_at"].replace("Z","+00:00")) for r in runs if str(r["id"])!=me and r.get("run_started_at")]; print(int((now-max((s for s in starts if mine and s < d.datetime.fromisoformat(mine[0]["run_started_at"].replace("Z","+00:00"))), default=now)).total_seconds()))' \
            || echo 0)
          case "$ELAPSED" in (*[!0-9]*|'') ELAPSED=0 ;; esac
          WAIT=$(( ${TARGET_SECONDS:-1320} - ELAPSED ))
          echo "previous cycle started ${ELAPSED}s ago; target gap ${TARGET_SECONDS}s"
          if [ "$WAIT" -gt 0 ]; then
            echo "waiting ${WAIT}s before this cycle"
            sleep "$WAIT"
          fi

      # The workflow may live in a public wrapper repository while the code
      # stays private: repository/token fall back to this run's own repo and
      # token, so the same file works either place.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO || github.repository }}
          token: ${{ secrets.CORE_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The rolling loop's own history: dedupe index, rolling state, label
      # queue. Deliberately an asset on the PRIVATE repository's release, not an
      # actions/cache entry: caches created in a public repository can be
      # restored by anyone who can read it, and this state carries the model's
      # own row history. With no PAT the step is a no-op and
      # provision_live_artifacts unpacks live_state_seed.tar.gz — a cold but
      # valid starting point.
      - name: Restore rolling state from the private release
        env:
          GH_TOKEN: ${{ secrets.CORE_PAT || github.token }}
          CORE_REPO: ${{ vars.CORE_REPO || github.repository }}
        run: |
          set -euo pipefail
          mkdir -p pipeline_output
          if gh release download live-artifacts --repo "$CORE_REPO" \
               --pattern 'live-state.tar.gz' --dir "$RUNNER_TEMP" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/live-state.tar.gz"
            echo "restored the rolling state from $CORE_REPO"
          else
            echo "no saved state yet - provision_live_artifacts will seed one"
          fi

      # Provisioned every run rather than cached: actions/cache is scoped to the
      # repository running the workflow, and in the wrapper setup that is the
      # public one — model packages and tiles must not land there. It is ~1 GB
      # from the same release, which is a minute or two at runner speed.

      # The venv must exist before provisioning: verify_with_project("cycle")
      # imports numpy/shapely through pipeline.sovereignty, and the bare runner
      # Python has none of the requirements installed. On the laptop this check
      # always ran on a machine that already had .venv — CI does not.
      - name: Create the virtualenv the cycle expects
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-live.txt

      - name: Provision artifacts from the live-artifacts release
        env:
          LIVE_ARTIFACTS_REPO: ${{ vars.CORE_REPO || github.repository }}
          LIVE_ARTIFACTS_TAG: live-artifacts
          # The core repository's own release is private, so the wrapper
          # placement needs a PAT that can read it; the core placement falls
          # back to its own run token.
          LIVE_ARTIFACTS_TOKEN: ${{ secrets.CORE_PAT || secrets.GITHUB_TOKEN }}
        run: .venv/bin/python -m pipeline.provision_live_artifacts

      - name: Fill the checkout with everything the live site serves
        run: bash deploy/ci/hydrate_web_assets.sh

      - name: Write project environment
        env:
          LIVE_ENV: ${{ secrets.LIVE_ENV }}
        run: |
          test -n "$LIVE_ENV" || { echo "::error::LIVE_ENV secret is empty"; exit 1; }
          printf '%s\n' "$LIVE_ENV" > .env

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install the Firebase CLI and authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          npm install -g firebase-tools
          # The cycle prunes old Hosting releases with gcloud before deploying;
          # without this it would keep every release until the storage quota
          # refused the next deploy.
          gcloud auth activate-service-account \
            --key-file="$RUNNER_TEMP/firebase-sa.json" \
            --project="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/firebase-sa.json")"

      - name: Run the cycle
        run: ./scripts/refresh_live_cycle.sh --force

      # refresh_live_cycle.sh redirects all of its output into logs/live_refresh.log,
      # so a failure here would otherwise show an empty red step. Surface the tail.
      - name: Cycle log tail (on failure)
        if: failure()
        run: |
          echo '::group::tail -n 200 logs/live_refresh.log'
          tail -n 200 logs/live_refresh.log 2>/dev/null || echo 'no log file written'
          echo '::endgroup::'

      # Persist the loop's history for the next run — as an asset on the private
      # release, never as a cache, for the same reason as the restore above. A
      # failed cycle keeps the previous state rather than publishing a partial
      # one, and a run without write access warns instead of failing the job.
      - name: Save rolling state to the private release
        env:
          GH_TOKEN: ${{ secrets.CORE_PAT || github.token }}
          CORE_REPO: ${{ vars.CORE_REPO || github.repository }}
        run: |
          set -euo pipefail
          test -d pipeline_output/live || { echo "no state to save"; exit 0; }
          tar -czf "$RUNNER_TEMP/live-state.tar.gz" pipeline_output/live
          if gh release upload live-artifacts "$RUNNER_TEMP/live-state.tar.gz" \
               --repo "$CORE_REPO" --clobber; then
            echo "saved rolling state to $CORE_REPO"
          else
            echo "::warning::could not write live-state.tar.gz back to $CORE_REPO — the next run will start from the seed"
          fi

      - name: Report
        run: |
          echo "### Live cycle published" >> "$GITHUB_STEP_SUMMARY"
          cat frontend/public/data/live_api/health.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Report the served age
        if: always()
        continue-on-error: true
        run: |
          AGE=$(curl -fsS --max-time 20 "https://sih26ekaant.web.app/api/health?probe=$(date +%s)" \
            | python3 -c 'import json,sys,datetime as d; g=d.datetime.fromisoformat(json.load(sys.stdin)["cycle_generated_at_utc"]); print(int((d.datetime.now(d.timezone.utc)-g).total_seconds()//60))' \
            || echo unknown)
          echo "served cycle age: ${AGE} min" >> "$GITHUB_STEP_SUMMARY"
